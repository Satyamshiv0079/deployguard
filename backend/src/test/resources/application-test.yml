server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:deployguard_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:dGVzdC1kZXZlbG9wbWVudC1vbmx5LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24tdXNlLTI1NmJpdHM=}
    expiration-ms: 3600000

logging:
  level:
    root: WARN
    com.deployguard: INFO
