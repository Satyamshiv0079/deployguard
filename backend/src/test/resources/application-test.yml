server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:deployguard_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

app:
  jwt:
    secret: ${TEST_JWT_SECRET:ZGVwbG95Z3VhcmQtdGVzdC1vbmx5LWRldGVybWluaXN0aWMtMjU2Yml0LXNpZ25pbmcta2V5IQ==}
    expiration-ms: 3600000

logging:
  level:
    root: WARN
    com.deployguard: INFO
