title = "DeployGuard Secret Scanner Configuration"

[extend]
useDefault = true

[allowlist]
description = "Narrow exceptions for verified historical synthetic test keys and local untracked build/tool outputs"
paths = [
  '''(?i)backend/target/.*''',
  '''(?i)tools/.*''',
  '''(?i)node_modules/.*'''
]
# Narrow, verified regex allowlist for historical synthetic CI test keys.
# These values are non-functional synthetic tokens present only in historical git commits
# and verified to carry zero permissions or production access.
regexes = [
  '''dGVzdC1kZXZlbG9wbWVudC1vbmx5LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24tdXNlLTI1NmJpdHM=''',
  '''ZGVwbG95Z3VhcmQtdGVzdC1vbmx5LWRldGVybWluaXN0aWMtMjU2Yml0LXNpZ25pbmcta2V5IQ==''',
  '''c3VwZXJTZWN1cmVEZXZlbG9wbWVudEtleU11c3RCZUF0TGVhc3QyNTZCaXRzMjAyNiE=''',
  '''c3VwZXJTZWN1cmVQcm9kdWN0aW9uS2V5TXVzdEJlQXRMZWFzdDI1NkJpdHMyMDI2IQ==''',
  '''ghp_1234567890abcdefghijklmnopqrstuvwxyz'''
]
