version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deployguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deployguard}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${POSTGRES_DB:-deployguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deployguard-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deployguard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-deployguard}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
    ports:
      - "8080:8080"
    networks:
      - deployguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deployguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - deployguard-net

volumes:
  postgres_data:
    driver: local

networks:
  deployguard-net:
    driver: bridge
